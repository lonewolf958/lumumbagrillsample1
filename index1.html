<!DOCTYPE html>
<html lang="en">

<head>

  <!-- =========================================================
       1. PAGE CONFIGURATION
       ========================================================= -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Lumumba Grill — Digital Menu</title>

  <meta
    name="description"
    content="Digital menu for Lumumba Grill, Good Food. Barbecue, chicken, beef, seafood, pizza and more."
  >

  <meta name="theme-color" content="#4a0a0e">

  <link rel="icon" href="logo.jpeg" type="image/jpeg">


  <!-- =========================================================
       2. GOOGLE FONTS
       Display font: Bebas Neue (matches the condensed logo lettering)
       Body font: Oswald
       ========================================================= -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <!-- =========================================================
       3. STYLESHEET

       style1.css is self-contained: it holds the colors, fonts,
       header, menu and footer styles. The old shared style.css
       is no longer needed for this page.
       ========================================================= -->

  <link rel="stylesheet" href="style1.css">

</head>


<body>

  <!-- =========================================================
       4. WEBSITE HEADER

       Logo, restaurant name, tagline, and a link back to the
       homepage.
       ========================================================= -->

  <header class="site-header">

    <div class="header-inner">

      <div class="brand-logo">
        <img
          src="logo.jpeg"
          alt="Lumumba Grill logo"
          width="1024"
          height="931"
        >
      </div>

      <div class="brand-copy">

        <h1 class="brand-name">Lumumba Grill</h1>

        <p class="brand-tagline">Good Food</p>

      </div>

      <a
        href="index.html"
        class="home-button"
        aria-label="Go back to home page"
      >
        Home
      </a>

    </div>

  </header>


  <!-- =========================================================
       5. MENU CATEGORY NAVIGATION

       script1.js adds one button per menu category here.
       ========================================================= -->

  <nav
    class="category-nav"
    aria-label="Menu categories"
  >

    <div
      class="category-nav-scroll"
      id="category-nav"
      role="tablist"
    ></div>

  </nav>


  <!-- =========================================================
       6. DIGITAL MENU CONTENT

       script1.js builds the categories, items and prices here.
       Edit the menu in script1.js, not in this file.
       ========================================================= -->

  <main
    id="menu-content"
    class="menu-content"
  ></main>


  <!-- =========================================================
       7. WEBSITE FOOTER
       ========================================================= -->

  <footer class="site-footer">

    <p class="footer-copyright">
      © <span id="year"></span> Lumumba Grill.
      All prices in Tanzanian Shillings.
    </p>
    <p class="footer-copyright">
      Please allow 30 minutes for your food to be prepared.
      Open 5 PM – 12 midnight. Closed on Thursday.
    </p>

  </footer>


  <!-- =========================================================
       8. DIGITAL MENU JAVASCRIPT
       ========================================================= -->

  <script src="script1.js"></script>

</body>

</html>
